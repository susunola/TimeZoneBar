name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # --disable-sandbox: SwiftPM's manifest sandbox fails on recent macOS with
      # "sandbox_apply: Operation not permitted".
      - name: Build
        run: swift build --disable-sandbox

      - name: Test
        run: swift test --disable-sandbox

      - name: Generate app icon
        run: python3 make_icon.py Resources

      # build.sh signs with a self-signed identity that only exists on the
      # maintainer's keychain, so CI assembles the bundle with ad-hoc signing
      # instead. This still catches Info.plist and bundle-layout regressions.
      - name: Assemble app bundle (ad-hoc signed)
        run: |
          set -euo pipefail
          swift build -c release --disable-sandbox
          APP="dist/TravelTime.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/TravelTime "$APP/Contents/MacOS/TravelTime"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp Resources/avatar.jpg "$APP/Contents/Resources/avatar.jpg"
          codesign --force --sign - --identifier com.atom.tzbar "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          echo "Bundle assembled and verified"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: TravelTime-app-unsigned
          path: dist/TravelTime.app
          if-no-files-found: error
