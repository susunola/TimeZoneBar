name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel
        2. Click ...
        3. ...
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "Output of: sw_vers -productVersion"
      placeholder: "14.6.1"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: TravelTime version
      description: Shown in Settings, or CFBundleShortVersionString in the bundle.
      placeholder: "1.3.3"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Downloaded a release
        - Built from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash report or console output
      description: For crashes, attach the report from Console.app. Optional otherwise.
      render: text
