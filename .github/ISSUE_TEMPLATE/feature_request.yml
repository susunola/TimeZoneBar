name: Feature request
description: Suggest a change or addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you run into, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: TravelTime is intentionally small and dependency-free.
      options:
        - label: This can be implemented without adding a third-party dependency
        - label: I have checked that no existing issue covers this
